living_room_nightlight:
  alias: Living Room - Nightlight
  description: Turns off every living room light except the harp lamp and turns the
    harp lamp on as a nightlight. If the harp lamp is already the only light on,
    it turns it off instead.
  variables:
    others: "{{ expand('light.all_living_room_lights') | map(attribute='entity_id')
      | reject('eq', 'light.harp_lamp') | list }}"
    others_on: "{{ expand(others) | selectattr('state', 'eq', 'on') | list | count
      > 0 }}"
  sequence:
  - if: "{{ is_state('light.harp_lamp', 'on') and not others_on }}"
    then:
    - action: light.turn_off
      target:
        entity_id: light.harp_lamp
    else:
    - action: light.turn_off
      target:
        entity_id: "{{ others }}"
    - action: light.turn_on
      target:
        entity_id: light.harp_lamp
      data:
        color_temp_kelvin: 2202
  mode: single
  icon: mdi:lightbulb-night-outline
living_room_all_lights_on_warm:
  alias: Living Room - All Lights Toggle (On Warm, Full / Off)
  description: If every living room light is already on at full brightness, turns
    them all off. Otherwise turns on every living room light at 100% brightness in warm white (2202K; shelf lights
    get 2000K), matching the warm white script.
  variables:
    shelf_lights:
    - light.top_shelf_light
    - light.lower_shelf_light
    all_lights: "{{ expand('light.all_living_room_lights') | map(attribute='entity_id')
      | list }}"
    shelf: "{{ all_lights | select('in', shelf_lights) | list }}"
    other: "{{ all_lights | reject('in', shelf_lights) | list }}"
  sequence:
  - if:
    - condition: template
      value_template: >-
        {% set live = all_lights | reject('is_state', ['unavailable', 'unknown']) | list %}
        {{ live | count > 0
           and live | reject('is_state', 'on') | list | count == 0
           and live | map('state_attr', 'brightness') | reject('none') | select('lt', 250) | list | count == 0 }}
    then:
    - action: light.turn_off
      target:
        entity_id: "{{ all_lights }}"
    else:
    - action: light.turn_on
      target:
        entity_id: "{{ other }}"
      data:
        color_temp_kelvin: 2202
        brightness_pct: 100
    - if: "{{ shelf | count > 0 }}"
      then:
      - action: light.turn_on
        target:
          entity_id: "{{ shelf }}"
        data:
          color_temp_kelvin: 2000
          brightness_pct: 100
  mode: single
  icon: mdi:power
