living_room_high_toggle:
  alias: Living Room - High Scene Toggle
  description: If any living room light is on, turns them all off. Otherwise activates
    the Living Room High scene. Used by the Living Room card's main icon.
  sequence:
  - if:
    - condition: state
      entity_id: light.all_living_room_lights
      state: 'on'
    then:
    - action: light.turn_off
      target:
        entity_id: light.all_living_room_lights
    else:
    - action: scene.turn_on
      target:
        entity_id: scene.living_room_high
  mode: single
  icon: mdi:sofa-outline
bedroom_warm_toggle:
  alias: Bedroom - Warm Lights Toggle
  description: If any bedroom light is on, turns them all off. Otherwise turns the
    bedroom lights on warm (2202K) at ~62% brightness. Used by the Bedroom card's
    main icon.
  sequence:
  - if:
    - condition: state
      entity_id: light.all_bedroom_lights
      state: 'on'
    then:
    - action: light.turn_off
      target:
        entity_id: light.all_bedroom_lights
    else:
    - action: light.turn_on
      target:
        entity_id: light.all_bedroom_lights
      data:
        color_temp_kelvin: 2202
        brightness: 157
  mode: single
  icon: mdi:bed-outline
