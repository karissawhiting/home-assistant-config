living_room_set_active_lights_to_warm_white:
  alias: Living Room - Set Active Lights to Warm White
  description: Sets every living room light that is currently ON to warm white (RGB
    255, 214, 170). Lights that are already off are left off.
  sequence:
  - action: light.turn_on
    target:
      entity_id: "{{ expand('light.all_living_room_lights')\n   | selectattr('state',
        'eq', 'on')\n   | map(attribute='entity_id')\n   | list }}"
    data:
      rgb_color:
      - 237
      - 180
      - 120
  mode: single
  icon: mdi:weather-sunny
