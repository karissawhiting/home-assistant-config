- type: custom:bubble-card
  card_type: separator
  sub_button:
    main: []
    bottom: []
  name: Indoor Air Monitor
  icon: mdi:home-thermometer
  grid_options:
    columns: full
  card_mod:
    style: |-
      ha-card {
        font-size: 16px;
        font-weight: normal;
        color: #7587e1;
        --bubble-line-background-color: #7587e1;
      }
- type: tile
  entity: sensor.temperature_and_humidity_monitor_temperature
  features:
    - type: trend-graph
  grid_options:
    columns: 12
    rows: 2
- type: heading
  icon: ""
  heading_style: title
- type: tile
  entity: sensor.temperature_and_humidity_monitor_humidity
  name:
    type: entity
  vertical: false
  features:
    - type: trend-graph
  features_position: bottom
  grid_options:
    columns: 12
    rows: 2
