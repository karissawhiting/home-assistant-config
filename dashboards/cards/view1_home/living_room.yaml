- type: custom:bubble-card
  card_type: separator
  sub_button:
    main: []
    bottom: []
  name: Living Room
  icon: mdi:sofa-single
  grid_options:
    columns: full
  card_mod:
    style: |-
      ha-card {
        font-size: 16px;
        font-weight: normal;
        color: #7587e1;
        --bubble-line-background-color: #7587e1;
      }
- type: custom:bubble-card
  card_type: button
  button_type: state
  entity: light.all_living_room_lights
  name: Living Room Lights
  icon: mdi:sofa-outline
  show_icon: true
  show_name: true
  show_state: true
  card_layout: large
  grid_options:
    columns: full
    rows: 5.5
  tap_action:
    action: toggle
  sub_button:
    main:
      - group:
          - entity: light.all_living_room_lights
            icon: mdi:power
            name: Toggle
            tap_action:
              action: toggle
          - entity: script.living_room_set_active_lights_to_warm_white
            icon: mdi:white-balance-sunny
            name: Set Warm
            tap_action:
              action: toggle
            hold_action:
              action: more-info
        buttons_layout: inline
    bottom_layout: rows
    bottom:
      - group:
          - entity: light.standing_lamp
            icon: mdi:floor-lamp
            name: Toggle
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.standing_lamp
            sub_button_type: slider
            fill_width: true
            always_visible: true
            show_background: true
            state_background: true
            show_name: true
            show_state: true
            show_icon: false
            show_button_info: true
            allow_light_slider_to_0: true
            hold_action:
              action: more-info
            name: Standing Lamp
            tap_to_slide: false
          - entity: light.standing_lamp
            icon: mdi:palette
            fill_width: false
            show_background: true
            state_background: false
            show_name: false
            show_state: false
            show_icon: true
            name: Colors
            tap_action:
              action: more-info
        buttons_layout: inline
        justify_content: start
      - group:
          - entity: light.desk_lamp_socket
            icon: mdi:desk-lamp
            name: Desk Toggle
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.desk_lamp_socket
            fill_width: true
            show_background: true
            state_background: true
            show_name: true
            show_state: true
            show_icon: false
            name: Desk Lamp
            tap_action:
              action: toggle
          - entity: light.desk_lamp_socket
            icon: mdi:blank
            fill_width: false
            show_background: false
            show_name: false
            show_state: false
            show_icon: true
            tap_action:
              action: none
            scrolling_effect: false
        buttons_layout: inline
        justify_content: start
      - group:
          - entity: light.living_room_arc_lamp
            icon: mdi:ceiling-light
            name: Toggle
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.living_room_arc_lamp
            sub_button_type: slider
            fill_width: true
            always_visible: true
            show_background: true
            state_background: true
            show_name: true
            show_state: true
            show_icon: false
            show_button_info: true
            allow_light_slider_to_0: true
            hold_action:
              action: more-info
            name: Arc Lamp
          - entity: light.living_room_arc_lamp
            icon: mdi:palette
            fill_width: false
            show_background: true
            state_background: false
            show_name: false
            show_state: false
            show_icon: true
            name: Colors
            tap_action:
              action: more-info
        buttons_layout: inline
      - group:
          - entity: light.octagon_lamp_socket
            icon: mdi:coach-lamp-variant
            name: Octagon Toggle
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.octagon_lamp_socket
            fill_width: true
            show_background: true
            state_background: true
            show_name: true
            show_state: true
            show_icon: false
            name: Octagon Lamp
            tap_action:
              action: toggle
          - entity: light.octagon_lamp_socket
            icon: mdi:blank
            fill_width: false
            show_background: false
            show_name: false
            show_state: false
            show_icon: true
            tap_action:
              action: none
            scrolling_effect: false
        buttons_layout: inline
        justify_content: start
      - group:
          - entity: light.all_shelf_lights
            icon: mdi:lamps
            name: Toggle
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.all_shelf_lights
            sub_button_type: slider
            fill_width: true
            always_visible: true
            show_background: true
            state_background: true
            show_name: true
            show_state: true
            show_icon: false
            show_button_info: true
            allow_light_slider_to_0: true
            hold_action:
              action: more-info
            name: Shelf Lights
          - entity: light.all_shelf_lights
            icon: mdi:palette
            fill_width: false
            show_background: true
            state_background: false
            show_name: false
            show_state: false
            show_icon: true
            name: Colors
            tap_action:
              action: more-info
        buttons_layout: inline
        justify_content: start
      - group:
          - entity: light.table_lamp
            icon: mdi:floor-lamp
            name: Toggle
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.table_lamp
            sub_button_type: slider
            fill_width: true
            always_visible: true
            show_background: true
            state_background: true
            show_name: true
            show_state: true
            show_icon: false
            show_button_info: true
            allow_light_slider_to_0: true
            hold_action:
              action: more-info
            name: Table Lamp
            tap_to_slide: false
          - entity: light.table_lamp
            icon: mdi:palette
            fill_width: false
            show_background: true
            state_background: false
            show_name: false
            show_state: false
            show_icon: true
            name: Colors
            tap_action:
              action: more-info
        buttons_layout: inline
        justify_content: start
  styles: |
    ha-card {
      --bubble-main-background-color: rgba(255, 255, 255, 0.07) !important;
      border-radius: 24px !important;
    }

    .desk-lamp {
      background: ${hass.states['light.desk_lamp_socket'].state === 'on' ? 'rgb(250, 208, 140)' : 'rgba(30, 30, 30, 1)'} !important;
    }

    .octagon-lamp {
      background: ${hass.states['light.octagon_lamp_socket'].state === 'on' ? 'rgb(250, 208, 140)' : 'rgba(30, 30, 30, 1)'} !important;
    }

    .desk-toggle {
      background: ${hass.states['light.desk_lamp_socket'].state === 'on' ? 'rgb(250, 208, 140)' : 'rgba(30, 30, 30, 1)'} !important;
    }

    .octagon-toggle {
      background: ${hass.states['light.octagon_lamp_socket'].state === 'on' ? 'rgb(250, 208, 140)' : 'rgba(30, 30, 30, 1)'} !important;
    }

    .desk-lamp .bubble-sub-button-name-container,
    .octagon-lamp .bubble-sub-button-name-container {
      justify-content: space-between !important;
      width: 100% !important;
    }
