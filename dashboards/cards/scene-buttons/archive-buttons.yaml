# Half Cinema scene ----------------------------------------------
- show_name: true
  show_icon: true
  type: button
  entity: scene.living_room_half_cinema
  theme: Google Dark Theme
  show_state: false
  grid_options:
    columns: 6
    rows: 1
  tap_action:
    action: toggle
  color: amber
  icon: mdi:movie-open-outline
  name: Half Cinema
  card_mod:
    style: |-
      ha-card {
        border-radius: 30px;
        border: 3px solid #7587e1;
      }
