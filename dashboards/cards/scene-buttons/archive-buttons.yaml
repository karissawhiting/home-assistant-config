# Archived buttons removed from scene-buttons.yaml (2026-11-15).
# Not included in any dashboard. Copy a block back into scene-buttons.yaml to restore.

# Living room AC ----------------------------------------------
- show_name: true
  show_icon: true
  type: button
  entity: climate.living_room_windmill_ac
  show_state: true
  name:
    type: entity
  icon: mdi:home-thermometer-outline
  color: green
  card_mod:
    style: |-
      ha-card {
        border-radius: 30px;
        border: 3px solid #7587e1;
      }

      ha-card {
        border: 3px solid 7587e1;
      }
