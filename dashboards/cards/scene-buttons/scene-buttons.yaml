# Cinema scene (tap opens mode pop-up) ------------------------------------------
- show_name: true
  show_icon: true
  type: button
  name: Cinema
  icon: mdi:movie-open
  theme: Google Dark Theme
  show_state: false
  grid_options:
    columns: 6
    rows: 1
  tap_action:
    action: navigate
    navigation_path: "#cinema"
  color: indigo
  card_mod:
    style: |-
      ha-card {
        border-radius: 30px;
        border: 3px solid #7587e1;
      }
# Cinema mode pop-up (hidden until the Cinema button is tapped) ------------------
- type: custom:bubble-card
  card_type: pop-up
  hash: "#cinema"
  close_on_click: true
  popup_mode: fit-content
  name: Cinema
  icon: mdi:movie-open
  cards:
    - type: grid
      columns: 3
      square: false
      cards:
        # More light: placeholder until a scene exists
        - show_name: true
          show_icon: true
          type: button
          name: More light
          icon: mdi:brightness-7
          show_state: false
          tap_action:
            action: none
          card_mod:
            style: |-
              ha-card {
                border-radius: 30px;
                border: 3px solid #7587e1;
              }
        # Less light: Half Cinema scene
        - show_name: true
          show_icon: true
          type: button
          entity: scene.living_room_half_cinema
          name: Less light
          icon: mdi:brightness-5
          show_state: false
          tap_action:
            action: toggle
          color: amber
          card_mod:
            style: |-
              ha-card {
                border-radius: 30px;
                border: 3px solid #7587e1;
              }
        # Least light: Cinema scene
        - show_name: true
          show_icon: true
          type: button
          entity: scene.living_room_cinema
          name: Least light
          icon: mdi:brightness-3
          show_state: false
          tap_action:
            action: toggle
          color: indigo
          card_mod:
            style: |-
              ha-card {
                border-radius: 30px;
                border: 3px solid #7587e1;
              }
