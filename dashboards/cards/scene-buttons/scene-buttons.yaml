# Nightlight (table lamp) ----------------------------------------------
- show_name: true
  show_icon: true
  type: button
  entity: light.table_lamp
  theme: Google Dark Theme
  show_state: false
  grid_options:
    columns: 6
    rows: 1
  tap_action:
    action: perform-action
    perform_action: light.toggle
    target:
      entity_id: light.table_lamp
    data:
      rgb_color:
        - 237
        - 180
        - 120
  color: grey
  icon: mdi:lightbulb-night-outline
  name: Nightlight
  card_mod:
    style: |-
      ha-card {
        border-radius: 30px;
        border: 3px solid #7587e1;
      }

      ha-state-icon {
        color: {{ '#8a7fd4' if is_state(config.entity, 'on') else '#8a7fd4' }} !important;
      }
