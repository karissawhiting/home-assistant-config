# Living Room Lights ------------------------------------
- show_name: true
  show_icon: true
  type: button
  name: Living Room Lights
  icon: mdi:lamp
  theme: Google Dark Theme
  show_state: false
  grid_options:
    columns: 6
    rows: 1
  tap_action:
    action: navigate
    navigation_path: "#living-room-lights"
  color: accent
  card_mod:
    style: |-
      ha-card {
        border-radius: 30px;
        border: 3px solid #7587e1;
      }

      ha-state-icon {
        color: #4b8b85 !important;
      }
# Living Room Lights pop-up (hidden until the Living Room Lights button is tapped)
- type: custom:bubble-card
  card_type: pop-up
  hash: "#living-room-lights"
  close_on_click: true
  popup_mode: centered
  name: Living Room Lights
  icon: mdi:lamp
  cards:
    - type: grid
      columns: 2
      square: false
      cards:
        # Low: Living Room Low scene
        - show_name: true
          show_icon: true
          type: button
          entity: scene.living_room_low
          name: Low
          icon: mdi:lamp
          show_state: false
          tap_action:
            action: toggle
          card_mod:
            style: |-
              ha-card {
                border-radius: 30px;
                border: 3px solid #7587e1;
              }
              ha-state-icon {
                color: #4b8b85 !important;
              }
        # High: Living Room High scene
        - show_name: true
          show_icon: true
          type: button
          entity: scene.living_room_high
          name: High
          icon: mdi:lamps
          show_state: false
          tap_action:
            action: toggle
          card_mod:
            style: |-
              ha-card {
                border-radius: 30px;
                border: 3px solid #7587e1;
              }
              ha-state-icon {
                color: #fff59d !important;
              }
# All Kitchen Lights ----------------------------------------------
- show_name: true
  show_icon: true
  type: button
  entity: light.all_kitchen_lights
  show_state: false
  grid_options:
    columns: 6
    rows: 1
  tap_action:
    action: toggle
  color: yellow
  icon: mdi:ceiling-light-multiple
  name: Kitchen Lights
  card_mod:
    style: |-
      ha-card {
        border-radius: 30px;
        border: 3px solid #7587e1;
      }
      {% if is_state(config.entity, 'on') %}
      ha-state-icon {
        color: #fff59d !important;
      }
      {% endif %}
# Nightlight (harp lamp) ----------------------------------------------
- show_name: true
  show_icon: true
  type: button
  entity: light.harp_lamp
  theme: Google Dark Theme
  show_state: false
  grid_options:
    columns: 6
    rows: 1
  tap_action:
    action: perform-action
    perform_action: script.living_room_nightlight
  hold_action:
    action: more-info
  color: grey
  icon: mdi:lightbulb-night-outline
  name: Nightlight
  card_mod:
    style: |-
      ha-card {
        border-radius: 30px;
        border: 3px solid #7587e1;
      }

      ha-state-icon {
        color: {{ '#8a7fd4' if is_state(config.entity, 'on') else '#8a7fd4' }} !important;
      }
