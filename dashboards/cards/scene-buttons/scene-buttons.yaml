# Goodbye scene ----------------------------------------------
- show_name: true
  show_icon: true
  type: button
  entity: scene.whole_apartment_goodbye
  theme: Google Dark Theme
  show_state: false
  grid_options:
    rows: 1
  tap_action:
    action: toggle
  color: purple
  card_mod:
    style: |-
      ha-card {
        border-radius: 30px;
        border: 3px solid #7587e1;
      }

      ha-card {
        border: 3px solid 7587e1;
      }
