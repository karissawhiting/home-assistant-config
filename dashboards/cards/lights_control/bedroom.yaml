- type: custom:bubble-card
  card_type: separator
  sub_button:
    main: []
    bottom: []
  name: Bedroom
  icon: mdi:bed
  grid_options:
    columns: full
  card_mod:
    style: |-
      ha-card {
        font-size: 16px;
        font-weight: normal;
        color: #7587e1;
        --bubble-line-background-color: #7587e1;
      }
- type: custom:bubble-card
  card_type: button
  button_type: state
  entity: light.all_bedroom_lights
  name: Bedroom
  icon: mdi:bed-outline
  show_icon: true
  show_name: true
  show_state: true
  card_layout: large
  grid_options:
    columns: full
    rows: 3
  tap_action:
    action: toggle
  sub_button:
    main:
      - group:
          - entity: light.all_bedroom_lights
            icon: mdi:power
            name: Toggle
            tap_action:
              action: toggle
          - entity: script.bedroom_set_active_lights_to_warm_white
            icon: mdi:white-balance-sunny
            name: Set Warm
            tap_action:
              action: toggle
            hold_action:
              action: more-info
        buttons_layout: inline
    bottom_layout: rows
    bottom:
      - group:
          - entity: light.bedroom_globe_lamp
            icon: mdi:globe-model
            name: Globe Toggle
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.bedroom_globe_lamp
            sub_button_type: slider
            fill_width: true
            always_visible: true
            show_background: true
            state_background: true
            show_name: true
            show_state: true
            show_icon: false
            show_button_info: true
            allow_light_slider_to_0: true
            hold_action:
              action: more-info
            name: Globe Lamp
          - entity: light.bedroom_globe_lamp
            icon: mdi:palette
            fill_width: false
            show_background: true
            state_background: false
            show_name: false
            show_state: false
            show_icon: true
            name: Colors
            tap_action:
              action: more-info
        buttons_layout: inline
        justify_content: start
      - group:
          - entity: light.bedroom_bedroom_lamp
            icon: mdi:floor-lamp
            name: Bedroom Toggle
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.bedroom_bedroom_lamp
            sub_button_type: slider
            fill_width: true
            always_visible: true
            show_background: true
            state_background: true
            show_name: true
            show_state: true
            show_icon: false
            show_button_info: true
            allow_light_slider_to_0: true
            hold_action:
              action: more-info
            name: Bedroom Lamp
          - entity: light.bedroom_bedroom_lamp
            icon: mdi:palette
            fill_width: false
            show_background: true
            state_background: false
            show_name: false
            show_state: false
            show_icon: true
            name: Colors
            tap_action:
              action: more-info
        buttons_layout: inline
        justify_content: start
  styles: |
    ha-card {
      --bubble-main-background-color: rgba(255, 255, 255, 0.07) !important;
      border-radius: 24px !important;
    }

    .globe-toggle {
      background: ${hass.states['light.bedroom_globe_lamp'].state === 'on' ? 'rgb(250, 208, 140)' : 'rgba(30, 30, 30, 1)'} !important;
    }

    .bedroom-toggle {
      background: ${hass.states['light.bedroom_bedroom_lamp'].state === 'on' ? 'rgb(250, 208, 140)' : 'rgba(30, 30, 30, 1)'} !important;
    }

    .globe-lamp .bubble-sub-button-name-container,
    .bedroom-lamp .bubble-sub-button-name-container {
      justify-content: space-between !important;
      width: 100% !important;
    }

    .globe-lamp,
    .bedroom-lamp {
      --bubble-sub-slider-background-color: rgba(30, 30, 30, 1) !important;
    }
- type: heading
  icon: none
  heading_style: title
