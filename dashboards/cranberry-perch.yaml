kiosk_mode:
  hide_header: true
  hide_sidebar: true
views:
  - title: Home
    cards: []
    type: sections
    badges: []
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards: !include cards/lights_control/bedroom.yaml
          - type: vertical-stack
            cards: !include cards/lights_control/kitchen.yaml
        column_span: 1
        background:
          opacity: 60
        theme: Google Dark Theme
      - type: grid
        cards: !include cards/lights_control/living_room.yaml
        column_span: 1
        background:
          opacity: 60
        theme: Google Dark Theme
      - type: grid
        cards: !include cards/scene-buttons/scene-buttons.yaml
        column_span: 1
    header:
      card:
        type: markdown
        content: "# Welcome to ✨ Cranberry Perch! ✨"
        text_only: true
        card_mod:
          style: |
            ha-markdown h1 {
              font-size: 5em;
              text-align: center;
            }
      layout: center
      badges_position: bottom
      badges_wrap: wrap
    theme: Google Dark Theme
    icon: mdi:creation
    footer:
      card:
        type: custom:navbar-card
        routes:
          - icon: mdi:creation-outline
            label: Home
            url: /cranberry-perch/0
            icon_selected: mdi:creation
          - icon: mdi:home-thermometer-outline
            url: /cranberry-perch/misc
            icon_selected: mdi:home-thermometer
          - icon: mdi:cog
            label: Settings
            url: /config/dashboard
      max_width: 790
    max_columns: 3
    dense_section_placement: true
  - type: sections
    theme: Google Dark Theme
    max_columns: 4
    title: climate
    path: misc
    icon: mdi:home-thermometer
    sections:
      - type: grid
        cards: !include cards/climate/indoor_climate_separator.yaml
        column_span: 13
      - type: grid
        cards: !include cards/climate/thermostats.yaml
        column_span: 2
        background:
          opacity: 50
        theme: Google Dark Theme
      - type: grid
        cards: !include cards/climate/indoor_air_monitor.yaml
        column_span: 1
        background:
          opacity: 60
      - type: grid
        cards: !include cards/climate/forecast_separator.yaml
        column_span: 13
      - type: grid
        cards: !include cards/climate/weather_forecast.yaml
        column_span: 2
      - type: grid
        cards: !include cards/climate/lunar_phase.yaml
      - type: grid
        cards: []
        column_span: 3
    cards: []
    footer:
      card:
        type: custom:navbar-card
        routes:
          - icon: mdi:creation-outline
            label: Home
            url: /cranberry-perch/0
            icon_selected: mdi:creation
          - icon: mdi:home-thermometer-outline
            url: /cranberry-perch/misc
            icon_selected: mdi:home-thermometer
          - icon: mdi:cog
            label: Settings
            url: /config/dashboard
  - type: sections
    theme: Google Dark Theme
    path: rooms
    max_columns: 3
    title: Rooms
    icon: mdi:lan
    dense_section_placement: true
    sections:
      - type: grid
        cards: !include cards/misc/heading.yaml
      - type: grid
        cards: !include cards/misc/sky_tonight.yaml
