kiosk_mode:
  hide_header: true
  hide_sidebar: true
views:
  - title: Home
    cards: []
    type: sections
    badges: []
    sections:
      - type: grid
        cards: !include cards/view1_home/bedroom_kitchen.yaml
        column_span: 1
        background:
          opacity: 60
      - type: grid
        cards: !include cards/view1_home/living_room.yaml
        column_span: 1
        background:
          opacity: 60
        theme: Google Dark Theme
      - type: grid
        cards: !include cards/view1_home/scenes.yaml
        column_span: 1
    header:
      card:
        type: markdown
        content: "# Welcome to ✨ Cranberry Perch! ✨"
        text_only: true
        card_mod:
          style: |
            ha-markdown h1 {
              font-size: 5em;
              text-align: center;
            }
      layout: center
      badges_position: bottom
      badges_wrap: wrap
    theme: Google Dark Theme
    icon: mdi:creation
    footer:
      card:
        type: custom:navbar-card
        routes:
          - icon: mdi:creation-outline
            label: Home
            url: /cranberry-perch/0
            icon_selected: mdi:creation
          - icon: mdi:home-thermometer-outline
            url: /cranberry-perch/misc
            icon_selected: mdi:home-thermometer
          - icon: mdi:cog
            label: Settings
            url: /config/dashboard
      max_width: 790
    max_columns: 3
    dense_section_placement: true
  - type: sections
    theme: Google Dark Theme
    max_columns: 4
    title: climate
    path: misc
    icon: mdi:home-thermometer
    sections:
      - type: grid
        cards: !include cards/view2_misc/indoor_climate_separator.yaml
        column_span: 13
      - type: grid
        cards: !include cards/view2_misc/thermostats.yaml
        column_span: 2
        background:
          opacity: 50
        theme: Google Dark Theme
      - type: grid
        cards: !include cards/view2_misc/indoor_air_monitor.yaml
        column_span: 1
        background:
          opacity: 60
      - type: grid
        cards: !include cards/view2_misc/forecast_separator.yaml
        column_span: 13
      - type: grid
        cards: !include cards/view2_misc/weather_forecast.yaml
        column_span: 2
      - type: grid
        cards: !include cards/view2_misc/lunar_phase.yaml
      - type: grid
        cards: []
        column_span: 3
    cards: []
    footer:
      card:
        type: custom:navbar-card
        routes:
          - icon: mdi:creation-outline
            label: Home
            url: /cranberry-perch/0
            icon_selected: mdi:creation
          - icon: mdi:home-thermometer-outline
            url: /cranberry-perch/misc
            icon_selected: mdi:home-thermometer
          - icon: mdi:cog
            label: Settings
            url: /config/dashboard
  - title: Home
    cards: !include cards/view3_home/view_cards.yaml
    type: sections
    badges:
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: weather.forecast_home
        show_entity_picture: true
        state_content:
          - state
          - temperature
          - humidity
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.sun_next_rising
        time_format: time
        color: amber
    sections:
      - type: grid
        cards: !include cards/view3_home/lights_separator.yaml
        column_span: 2
      - type: grid
        cards: !include cards/view3_home/scenes.yaml
        column_span: 1
      - type: grid
        cards: !include cards/view3_home/living_room.yaml
        column_span: 1
        background:
          opacity: 60
        theme: Google Dark Theme
      - type: grid
        cards: !include cards/view3_home/bedroom_kitchen.yaml
        column_span: 1
        background:
          opacity: 60
      - type: grid
        cards: !include cards/view3_home/indoor_air_monitor.yaml
        column_span: 1
        background:
          opacity: 60
      - type: grid
        cards: !include cards/view3_home/climate_weather_separators.yaml
        column_span: 3
      - type: grid
        cards: !include cards/view3_home/thermostats.yaml
        column_span: 2
        background:
          opacity: 50
        theme: Google Dark Theme
      - type: grid
        cards: !include cards/view3_home/moon_weather.yaml
    header:
      card:
        type: markdown
        content: "# Welcome to ✨ Cranberry Perch! ✨"
        text_only: true
        card_mod:
          style: |
            ha-markdown h1 {
              font-size: 5em;
              text-align: center;
            }
      layout: center
      badges_position: bottom
      badges_wrap: wrap
    theme: Google Dark Theme
    icon: mdi:alpha-x
    footer:
      card:
        type: custom:navbar-card
        routes:
          - icon: mdi:home
            label: Home
            url: /cranberry-perch/home
          - icon: mdi:creation
            label: Automations
            url: /cranberry-perch/misc
          - icon: mdi:cog
            label: Settings
            url: /config/dashboard
      max_width: 790
    max_columns: 3
    dense_section_placement: true
  - type: sections
    theme: Google Dark Theme
    path: rooms
    max_columns: 3
    title: Rooms
    icon: mdi:lan
    dense_section_placement: true
    sections:
      - type: grid
        cards: !include cards/view4_rooms/heading.yaml
      - type: grid
        cards: !include cards/view4_rooms/sky_tonight.yaml
